<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI Chat</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;display:flex;flex-direction:column;height:100vh;background:#111;color:#eee}
  header,form{display:flex;gap:8px;padding:10px;background:#1b1b1b}
  input{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#222;color:#eee;font-size:16px}
  #log{flex:1;overflow-y:auto;padding:12px}
  .msg{max-width:80%;margin:8px 0;padding:10px 14px;border-radius:12px;white-space:pre-wrap}
  .user{background:#2563eb;margin-left:auto}
  .bot{background:#262626}
  button{padding:0 18px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:16px}
</style>
</head>
<body>
<header>
  <input id="url" value="http://localhost:11434" aria-label="Ollama URL">
  <input id="model" value="llama3.2" aria-label="Model">
</header>
<div id="log"></div>
<form id="form">
  <input id="text" placeholder="Ask your local model..." autocomplete="off">
  <button>Send</button>
</form>
<script>
const log = document.getElementById("log");
const history = [];

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  add("user", text);
  history.push({ role: "user", content: text });
  const bot = add("bot", "...");
  let reply = "";
  try {
    const res = await fetch(document.getElementById("url").value + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: document.getElementById("model").value,
        messages: history,
        stream: true
      })
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        reply += JSON.parse(line).message?.content || "";
        bot.textContent = reply;
        log.scrollTop = log.scrollHeight;
      }
    }
    history.push({ role: "assistant", content: reply });
  } catch (err) {
    bot.textContent = "Could not reach the model. Is Ollama running? (" + err.message + ")";
  }
});
</script>
</body>
</html>
